<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CV Submission Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
      animation: fadeIn 0.6s ease-in-out;
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
      color: #2a5298;
    }

    p.subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      font-weight: 600;
      margin-top: 15px;
      display: block;
      color: #333;
    }

    input[type="text"],
    input[type="email"],
    input[type="file"] {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #2a5298;
    }

    .btn {
      width: 100%;
      margin-top: 25px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #2a5298, #1e3c72);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .btn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      display: none;
      font-size: 14px;
      text-align: center;
    }

    .success {
      background: #e6f9f0;
      color: #137a4a;
      border: 1px solid #b7ead3;
    }

    .error {
      background: #fdeaea;
      color: #a12525;
      border: 1px solid #f5b5b5;
    }

    footer {
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
      color: #888;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Upload Your CV</h2>
    <p class="subtitle">Submit your profile and we’ll get back to you</p>

    <form id="cvForm">
      <label>Full Name</label>
      <input type="text" name="full_name" required />

      <label>Email Address</label>
      <input type="email" name="email" required />

      <label>Upload CV (PDF only)</label>
      <input type="file" name="file" accept="application/pdf" required />

      <button class="btn" type="submit">Submit CV</button>
    </form>

    <div id="message" class="message"></div>

    <footer>
      © 2025 CV Submission Portal
    </footer>
  </div>

  <script>
    const form = document.getElementById("cvForm");
    const messageBox = document.getElementById("message");

    // 🔴 Replace this with your API Gateway endpoint
    const API_URL = "https://jspy3aof8c.execute-api.ap-south-1.amazonaws.com/UAT/submit";

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      messageBox.style.display = "none";

      const formData = new FormData(form);

      const button = form.querySelector("button");
      button.disabled = true;
      button.textContent = "Uploading...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (response.ok) {
          messageBox.className = "message success";
          messageBox.textContent = data.message || "CV uploaded successfully!";
          form.reset();
        } else {
          messageBox.className = "message error";
          messageBox.textContent = data.message || "Upload failed.";
        }

      } catch (error) {
        messageBox.className = "message error";
        messageBox.textContent = "Network error. Please try again.";
      }

      messageBox.style.display = "block";
      button.disabled = false;
      button.textContent = "Submit CV";
    });
  </script>

</body>
</html>
